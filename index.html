<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Surco</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="bubbles" aria-hidden="true"></div>
  <div class="app">
  <header class="mast">
    <div class="mast-row">
      <p class="brand">Surco <span>Manteca</span></p>
      <div class="mast-actions">
        <button id="open-lang" class="lang-open" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="lang-sheet">English</button>
        <button id="open-chat" type="button">Ask Yema</button>
      </div>
    </div>
    <nav id="tabs" class="tabs" aria-label="Sections"></nav>
  </header>
  <section id="chat" class="chat" hidden>
    <div class="chat-head">
      <p>Yema</p>
      <div class="chat-tools">
        <button id="voice-toggle" type="button" aria-pressed="false">Voice</button>
        <button id="close-chat" type="button">Close</button>
      </div>
    </div>
    <div id="voice-stage" class="voice-stage" hidden>
      <button id="voice-mic" type="button" aria-pressed="false">
        <span class="voice-ring"></span>
        <span class="voice-ring delay"></span>
        <span class="voice-core"></span>
      </button>
      <p id="voice-state"></p>
    </div>
    <div id="chat-log" class="chat-log"></div>
    <div id="chat-suggests" class="suggests"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Water, heat, bugs, or when to pick" autocomplete="off" />
      <button id="chat-send" type="submit">Send</button>
    </form>
  </section>
  <main id="panel"></main>
  </div>
  <div id="lang-sheet" class="lang-sheet" hidden>
    <div class="lang-veil"></div>
    <div class="lang-stage" role="dialog" aria-modal="true" aria-labelledby="lang-title">
      <div class="lang-float" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="lang-head">
        <div>
          <p class="lang-kicker">Manteca</p>
          <h2 id="lang-title">Language</h2>
          <p id="lang-note" class="lang-note"></p>
        </div>
        <button id="close-lang" type="button">Close</button>
      </div>
      <div id="langs" class="lang-grid" role="listbox" aria-label="Language"></div>
    </div>
  </div>
  <script src="vendor/tf.min.js"></script>
  <script src="vendor/mobilenet.min.js"></script>
  <script src="data.js"></script>
  <script src="plants-more.js"></script>
  <script src="plant-photos.js"></script>
  <script src="water.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
